<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CPS Tester Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --accent-main: #2196F3;
            --accent-flash: #0A2440;
            --bg-color: #1a1a1a;
            --panel-bg: #2d2d2d;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --p1-color: #E53935;
            --p2-color: #2196F3;
        }

        body.light-mode {
            --bg-color: #f0f0f0;
            --panel-bg: #ffffff;
            --text-main: #121212;
            --text-muted: #666666;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Top Bar */
        .header {
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px 0;
        }

        .header-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 130px;
        }

        .btn-small {
            background-color: #444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        body.light-mode .btn-small { background-color: #ddd; color: #121212; }

        /* Main Game Area */
        .game-area { display: flex; flex-direction: column; align-items: center; width: 100%; flex-grow: 1; justify-content: center; }
        .time-selector { margin-bottom: 20px; display: flex; gap: 5px; align-items: center; }
        .preset-btn { background-color: #333; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        body.light-mode .preset-btn { background-color: #ddd; color: #121212; }
        #custom-time { width: 50px; padding: 8px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; text-align: center; font-weight: bold; }
        body.light-mode #custom-time { background: #eee; color: #121212; border-color: #ccc; }
        #pb-label { color: var(--accent-main); font-weight: bold; margin-bottom: 15px; }
        
        #click-btn {
            width: 85%; height: 35vh; background-color: var(--accent-main); color: white; font-size: 60px; font-weight: bold;
            border: none; border-radius: 40px; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; transition: background-color 0.1s;
        }
        #click-btn:active { transform: scale(0.97); }
        #pause-btn { margin-top: 15px; padding: 10px 20px; font-size: 18px; border-radius: 8px; display: none; width: auto; }
        .stats { display: flex; gap: 30px; font-size: 28px; font-weight: bold; margin-top: 20px; }
        #score-label { color: var(--accent-main); }
        
        /* Modals */
        .modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        .modal-content {
            background: var(--panel-bg); padding: 30px; border-radius: 15px; width: 85%; max-width: 400px;
            text-align: center; max-height: 85vh; overflow-y: auto;
        }
        .modal h2 { margin-top: 0; color: var(--accent-main); }

        /* Minigame General */
        .mg-menu-btn {
            background-color: #333; color: white; border: 2px solid #555; padding: 15px; margin: 8px 0; width: 100%;
            border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; box-sizing: border-box;
        }
        body.light-mode .mg-menu-btn { background-color: #eee; border-color: #ccc; color: #121212; }
        .mg-menu-btn:hover { border-color: var(--accent-main); }
        .mg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .mg-back-btn { background-color: #555; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px;}
        
        /* 2-Player Versus */
        .vs-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; flex-direction: column; z-index: 20; overflow: hidden; touch-action: none;}
        .vs-half { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent;}
        .vs-p1 { background-color: var(--p1-color); transform: rotate(180deg); }
        .vs-p2 { background-color: var(--p2-color); }
        .vs-score { font-size: 80px; font-weight: bold; color: white; margin: 0; pointer-events: none;}
        .vs-label { font-size: 20px; font-weight: bold; color: rgba(255,255,255,0.7); pointer-events: none;}
        .vs-timer-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; color: white; padding: 15px 30px; border-radius: 30px; font-size: 32px; font-weight: bold; z-index: 25; pointer-events: none; border: 4px solid #fff;}
        .vs-close-btn { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.5); color: white; border: 2px solid white; padding: 8px 15px; border-radius: 8px; z-index: 30; font-weight: bold; cursor: pointer;}
        
        /* Tug of War Overlay */
        .tug-bar-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 22; pointer-events: none; display: flex; flex-direction: column;}
        .tug-red { background-color: var(--p1-color); width: 100%; transition: height 0.1s; }
        .tug-blue { background-color: var(--p2-color); width: 100%; flex-grow: 1; transition: height 0.1s;}
        .tug-line { width: 100%; height: 10px; background: white; box-shadow: 0 0 15px rgba(255,255,255,0.8); z-index: 23;}

        /* Leaderboard Tabs */
        .lb-tabs { display: flex; width: 100%; margin-bottom: 15px; background: #333; border-radius: 8px; overflow: hidden; }
        .lb-tab { flex: 1; padding: 10px; text-align: center; font-weight: bold; cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .lb-tab.active { background: var(--accent-main); color: white; }
        body.light-mode .lb-tabs { background: #eee; }
        
        /* Standard UI elements */
        canvas { background: var(--bg-color); border-radius: 8px; margin: 15px 0; width: 100%; height: 150px; }
        .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .color-swatch { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .leaderboard-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #444; font-weight: bold; font-size: 14px;}
        body.light-mode .leaderboard-row { border-color: #ddd; }
        .danger-btn { background-color: #E53935; }
        .success-btn { background-color: #4CAF50; }
        .theme-btn { background-color: #555; }
        .action-btn { color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 16px; margin: 5px; width: 100%; cursor: pointer; box-sizing: border-box;}
        .accent-btn { background-color: var(--accent-main); }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-small" style="width: auto;" onclick="showModal('settings-modal')">⚙️ Settings</button>
        <img src="icon.svg" alt="Logo" style="width: 40px; height: 40px; border-radius: 10px;">
        <div class="header-controls">
            <button class="btn-small" onclick="showLeaderboard()">🏆 Leaderboard</button>
            <button class="btn-small" style="background-color: #555;" onclick="openMinigameHub()">🎯 Minigames</button>
        </div>
    </div>

    <div class="game-area" id="game-area">
        <h1 id="timer">Time left: 5.0s</h1>
        <div class="time-selector">
            <button class="preset-btn" onclick="setTime(1)">1s</button>
            <button class="preset-btn" onclick="setTime(3)">3s</button>
            <button class="preset-btn" onclick="setTime(5)">5s</button>
            <button class="preset-btn" onclick="setTime(10)">10s</button>
            <input type="number" id="custom-time" value="5" onchange="updateCustomTime()">
        </div>
        <div id="pb-label">Personal Best: 0.00 CPS</div>
        <button id="click-btn">START</button>
        <button id="pause-btn" class="btn-small" onclick="togglePause()">⏸ Pause</button>
        <div class="stats">
            <span id="score-label">Clicks: 0</span>
            <span id="cps-label">CPS: 0.00</span>
        </div>
    </div>

    <!-- MINIGAME HUB MODAL -->
    <div class="modal" id="minigame-modal">
        <div class="modal-content" style="width: 90%; max-width: 500px; padding: 20px;">
            <div id="mg-menu-screen">
                <div class="mg-header">
                    <h2 style="margin: 0;">Minigames</h2>
                    <button class="btn-small danger-btn" style="width: auto;" onclick="closeMinigames()">Close</button>
                </div>
                <!-- Adding 2 Player Menu -->
                <button class="mg-menu-btn" style="border-color: #E91E63;" onclick="showGame('versus')">👯 2 Player (Versus)</button>
                <button class="mg-menu-btn" onclick="showGame('target')">🎯 Target Practice</button>
                <button class="mg-menu-btn" onclick="showGame('react')">⚡ Reaction Time</button>
                <button class="mg-menu-btn" onclick="showGame('sprint')">🏁 100-Click Sprint</button>
                <button class="mg-menu-btn" onclick="showGame('grid')">🔲 Grid Mode</button>
            </div>

            <!-- Versus Setup Screen -->
            <div id="mg-versus-screen" style="display: none;">
                <div class="mg-header">
                    <h2 style="margin: 0;">2 Player Mode</h2>
                    <button class="mg-back-btn" onclick="backToHub()">Back</button>
                </div>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Place your phone flat on a table between you and a friend.</p>
                <button class="action-btn accent-btn" onclick="startVersus('classic')">⚔️ Classic Mode (10s)</button>
                <button class="action-btn theme-btn" onclick="startVersus('tug')">🧵 Tug of War</button>
            </div>
            
            <!-- Other Minigame stubs (Reused from previous logic) -->
            <div id="mg-target-screen" style="display:none;">...</div><div id="mg-react-screen" style="display:none;">...</div><div id="mg-sprint-screen" style="display:none;">...</div><div id="mg-grid-screen" style="display:none;">...</div>
        </div>
    </div>

    <!-- FULLSCREEN 2 PLAYER VERSUS MODE -->
    <div id="vs-container" class="vs-screen">
        <button class="vs-close-btn" onclick="exitVersus()">Exit</button>
        <div id="vs-timer" class="vs-timer-overlay">READY</div>
        
        <!-- Tug of War Visuals -->
        <div id="vs-tug-layer" class="tug-bar-container" style="display: none;">
            <div id="tug-red-fill" class="tug-red" style="height: 50%;"></div>
            <div class="tug-line"></div>
            <div class="tug-blue"></div>
        </div>

        <div id="vs-area-p1" class="vs-half vs-p1" onmousedown="vsClick(1, event)" ontouchstart="vsClick(1, event)">
            <p class="vs-label">PLAYER 1</p>
            <p id="vs-score-p1" class="vs-score">0</p>
        </div>
        <div id="vs-area-p2" class="vs-half vs-p2" onmousedown="vsClick(2, event)" ontouchstart="vsClick(2, event)">
            <p class="vs-label">PLAYER 2</p>
            <p id="vs-score-p2" class="vs-score">0</p>
        </div>
    </div>

    <!-- LEADERBOARD MODAL -->
    <div class="modal" id="leaderboard-modal">
        <div class="modal-content">
            <h2 id="lb-title">Top 10: 5.0s</h2>
            
            <!-- Tab Navigation -->
            <div class="lb-tabs">
                <div id="tab-local" class="lb-tab active" onclick="switchLBTab('local')">Local</div>
                <div id="tab-world" class="lb-tab" onclick="switchLBTab('world')">World 🌍</div>
            </div>

            <div id="lb-content" style="margin-bottom: 20px; min-height: 200px;"></div>
            <button class="action-btn danger-btn" onclick="hideModals()">Close</button>
        </div>
    </div>

    <!-- Standard Modals -->
    <div class="modal" id="end-modal">
        <div class="modal-content">
            <h2>Test Complete!</h2>
            <h1 id="end-cps" style="margin: 10px 0;">0.00 CPS</h1>
            <p id="end-stats" style="color: var(--text-muted); margin: 0 0 15px 0;">Clicks: 0 | Rank: N/A</p>
            <canvas id="cps-graph"></canvas>
            <p id="end-pb-alert" style="font-weight: bold;"></p>
            <button class="action-btn accent-btn" onclick="copyResults()">📋 Copy Result</button>
            <button class="action-btn accent-btn" onclick="resetGame()">🔄 Play Again</button>
        </div>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h2>Settings</h2>
            <button class="action-btn theme-btn" onclick="toggleTheme()">🌗 Toggle Dark/Light Mode</button>
            <p style="margin-top: 20px;">Theme Color</p>
            <div class="color-grid" id="color-grid"></div>
            <hr style="border-color: #444; margin: 20px 0;">
            <button class="action-btn danger-btn" id="wipe-btn" onclick="wipeLeaderboard()">🗑 Wipe Leaderboard</button>
            <button class="action-btn success-btn" onclick="hideModals()">Done</button>
        </div>
    </div>

    <script>
        // --- BASE GAME LOGIC ---
        const colors = {
            "Pink": ["#E91E63", "#4A0920"], "Red": ["#E53935", "#380B0A"],
            "Orange": ["#FF9800", "#4A2C00"], "Yellow": ["#FFB300", "#4A3300"],
            "Green": ["#2CC985", "#0B3322"], "Blue": ["#2196F3", "#0A2440"],
            "Indigo": ["#3F51B5", "#0A1138"], "Violet": ["#9C27B0", "#2A0A30"]
        };
        let currentCategory = "5.0"; let duration = 5.0; let timeLeft = 5.0; let clicks = 0;
        let isRunning = false; let isFinished = false; let isPaused = false;
        let timerInterval; let clickTimestamps = [];
        let highScores = JSON.parse(localStorage.getItem('cps_highscores')) || { "1.0": [], "3.0": [], "5.0": [], "10.0": [], "60.0": [], "custom": [] };

        const root = document.documentElement;
        setupTheme(); setupColors(); updatePBDisplay();

        function setupTheme() { if (localStorage.getItem('cps_theme') === 'light') document.body.classList.add('light-mode'); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); localStorage.setItem('cps_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark'); }
        function setupColors() {
            const grid = document.getElementById("color-grid");
            for (const [name, hexes] of Object.entries(colors)) {
                let swatch = document.createElement("div"); swatch.className = "color-swatch"; swatch.style.backgroundColor = hexes[0];
                swatch.onclick = () => applyColor(name); grid.appendChild(swatch);
            }
            applyColor(localStorage.getItem('cps_color') || "Blue");
        }
        function applyColor(name) {
            root.style.setProperty('--accent-main', colors[name][0]);
            root.style.setProperty('--accent-flash', colors[name][1]);
            localStorage.setItem('cps_color', name);
        }

        // --- STANDARD CPS GAME ---
        function setTime(seconds) {
            if (isRunning) return;
            duration = parseFloat(seconds); timeLeft = duration; document.getElementById("custom-time").value = duration;
            currentCategory = [1, 3, 5, 10, 60].includes(duration) ? duration.toFixed(1) : "custom";
            document.getElementById("timer").innerText = `Time left: ${timeLeft.toFixed(1)}s`; updatePBDisplay();
        }
        function updateCustomTime() { let val = parseFloat(document.getElementById("custom-time").value); if (isNaN(val) || val <= 0) val = 5.0; setTime(val); }
        function updatePBDisplay() {
            let scores = highScores[currentCategory] || []; let topCps = scores.length > 0 ? scores[0].cps : 0.00;
            let catName = currentCategory === "custom" ? "Custom" : `${currentCategory}s`;
            document.getElementById("pb-label").innerText = `Personal Best (${catName}): ${topCps.toFixed(2)} CPS`;
        }
        function togglePause() {
            if (!isRunning || isFinished) return;
            isPaused = !isPaused;
            let btn = document.getElementById("click-btn"); let pBtn = document.getElementById("pause-btn");
            if (isPaused) { pBtn.innerText = "▶ Resume"; btn.innerText = "PAUSED"; btn.style.backgroundColor = "#555"; } 
            else { pBtn.innerText = "⏸ Pause"; btn.innerText = clicks; btn.style.backgroundColor = "var(--accent-flash)"; }
        }

        const clickBtn = document.getElementById("click-btn");
        clickBtn.addEventListener('mousedown', (e) => { if (e.button === 0) handleTap(); });
        clickBtn.addEventListener('touchstart', (e) => { e.preventDefault(); for (let i = 0; i < e.changedTouches.length; i++) handleTap(); }, { passive: false });

        function handleTap() {
            if (isFinished || isPaused) return;
            if (navigator.vibrate) navigator.vibrate(10);
            if (!isRunning) {
                isRunning = true; clicks = 1; clickTimestamps = [0];
                clickBtn.innerText = clicks; clickBtn.style.backgroundColor = "var(--accent-flash)";
                document.getElementById("pause-btn").style.display = "block";
                timerInterval = setInterval(updateTimer, 50);
            } else { clicks++; clickBtn.innerText = clicks; clickTimestamps.push(duration - timeLeft); }
            let elapsed = duration - timeLeft;
            document.getElementById("score-label").innerText = `Clicks: ${clicks}`;
            document.getElementById("cps-label").innerText = `CPS: ${(clicks / Math.max(elapsed, 0.001)).toFixed(2)}`;
        }

        function updateTimer() {
            if (isPaused) return;
            timeLeft -= 0.05;
            if (timeLeft <= 0) { timeLeft = 0; endGame(); }
            document.getElementById("timer").innerText = `Time left: ${timeLeft.toFixed(1)}s`;
        }

        function endGame() {
            clearInterval(timerInterval); isRunning = false; isFinished = true; isPaused = false;
            document.getElementById("pause-btn").style.display = "none";
            let finalCPS = clicks / duration;
            let rank = finalCPS < 5 ? "🐢 Turtle" : finalCPS < 8 ? "🚶 Walker" : finalCPS < 12 ? "🏃 Sprinter" : "⚡ Lightning";
            let scores = highScores[currentCategory] || []; let isPB = scores.length === 0 || finalCPS > scores[0].cps;
            scores.push({cps: finalCPS, clicks: clicks}); scores.sort((a, b) => b.cps - a.cps);
            highScores[currentCategory] = scores.slice(0, 10); localStorage.setItem('cps_highscores', JSON.stringify(highScores));
            document.getElementById("end-cps").innerText = `${finalCPS.toFixed(2)} CPS`;
            document.getElementById("end-stats").innerText = `Total Clicks: ${clicks} | Rank: ${rank}`;
            let pbAlert = document.getElementById("end-pb-alert");
            if (isPB) { pbAlert.innerText = "🏆 NEW PERSONAL BEST! 🏆"; pbAlert.style.color = "#4CAF50"; } 
            else { pbAlert.innerText = `PB: ${scores[0].cps.toFixed(2)} CPS`; pbAlert.style.color = "var(--text-muted)"; }
            drawGraph(); showModal('end-modal');
        }

        function drawGraph() {
            const canvas = document.getElementById('cps-graph'); const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth - 60; canvas.height = 150;
            let numBins = Math.max(Math.floor(duration * 2), 5); let binSize = duration / numBins; let bins = new Array(numBins).fill(0);
            clickTimestamps.forEach(t => { let index = Math.min(Math.floor(t / binSize), numBins - 1); if (index >= 0) bins[index]++; });
            let cpsPerBin = bins.map(count => count / binSize); let maxCPS = Math.max(...cpsPerBin, 5);
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = getComputedStyle(root).getPropertyValue('--accent-main').trim();
            ctx.lineWidth = 3; ctx.lineJoin = 'round';
            ctx.beginPath();
            for (let i = 0; i < numBins; i++) {
                let x = (i / (numBins - 1)) * canvas.width; let y = canvas.height - ((cpsPerBin[i] / maxCPS) * (canvas.height - 20)) - 10;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.fillStyle = document.body.classList.contains('light-mode') ? "#121212" : "#fff";
            for (let i = 0; i < numBins; i++) {
                let x = (i / (numBins - 1)) * canvas.width; let y = canvas.height - ((cpsPerBin[i] / maxCPS) * (canvas.height - 20)) - 10;
                ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
            }
        }

        function resetGame() {
            hideModals(); isFinished = false; isPaused = false; clicks = 0; timeLeft = duration;
            document.getElementById("timer").innerText = `Time left: ${timeLeft.toFixed(1)}s`;
            document.getElementById("score-label").innerText = "Clicks: 0"; document.getElementById("cps-label").innerText = "CPS: 0.00";
            clickBtn.innerText = "START"; clickBtn.style.backgroundColor = "var(--accent-main)";
            document.getElementById("pause-btn").style.display = "none"; document.getElementById("pause-btn").innerText = "⏸ Pause";
            updatePBDisplay();
        }

        // --- MULTI-TAB LEADERBOARD (LOCAL vs WORLD) ---
        let currentLBTab = 'local';
        
        function showLeaderboard() {
            let catName = currentCategory === "custom" ? "Custom" : `${currentCategory}s`; 
            document.getElementById("lb-title").innerText = `Top 10: ${catName}`;
            renderLeaderboard();
            showModal('leaderboard-modal');
        }

        function switchLBTab(tab) {
            currentLBTab = tab;
            document.getElementById('tab-local').classList.toggle('active', tab === 'local');
            document.getElementById('tab-world').classList.toggle('active', tab === 'world');
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const content = document.getElementById("lb-content");
            if (currentLBTab === 'local') {
                let scores = highScores[currentCategory] || []; let html = "";
                if (scores.length === 0) html = "<p style='color: var(--text-muted); margin-top: 40px;'>No scores yet!</p>";
                else scores.forEach((s, i) => { 
                    let color = i === 0 ? "#FF9800" : (document.body.classList.contains('light-mode') ? "black" : "white"); 
                    html += `<div class="leaderboard-row" style="color: ${color}"><span>#${i+1}</span><span>${s.cps.toFixed(2)} CPS</span><span style="color: var(--text-muted);">(${s.clicks} clicks)</span></div>`; 
                });
                content.innerHTML = html;
            } else {
                // Simulated Backend Fetch for World Leaderboard
                content.innerHTML = `<p style='color: var(--accent-main); margin-top: 40px;'>Loading Database...</p>`;
                setTimeout(() => {
                    // MOCK DATA: To connect a real backend, replace this setTimeout block with a fetch() call to Firebase/Supabase!
                    let mockWorldData = [
                        { name: "Faker", cps: 15.2 }, { name: "Guest_992", cps: 14.8 }, { name: "NinjaTapper", cps: 13.9 },
                        { name: "MobilePro", cps: 12.5 }, { name: "User821", cps: 11.2 }
                    ];
                    let html = `<p style="font-size: 12px; color: #888;">(Live Global DB Connection Required for Real Sync)</p>`;
                    mockWorldData.forEach((s, i) => {
                        let color = i === 0 ? "#FF9800" : (document.body.classList.contains('light-mode') ? "black" : "white"); 
                        html += `<div class="leaderboard-row" style="color: ${color}"><span>#${i+1} ${s.name}</span><span>${s.cps.toFixed(2)} CPS</span></div>`; 
                    });
                    content.innerHTML = html;
                }, 800);
            }
        }

        function wipeLeaderboard() {
            if(confirm("Are you sure? This deletes all saved scores.")) {
                highScores = { "1.0": [], "3.0": [], "5.0": [], "10.0": [], "60.0": [], "custom": [] }; localStorage.setItem('cps_highscores', JSON.stringify(highScores)); updatePBDisplay();
                let btn = document.getElementById("wipe-btn"); btn.innerText = "Wiped! ✅"; btn.classList.replace("danger-btn", "success-btn");
                setTimeout(() => { btn.innerText = "🗑 Wipe Leaderboard"; btn.classList.replace("success-btn", "danger-btn"); }, 2000);
            }
        }
        function copyResults() {
            let finalCPS = (clicks / duration).toFixed(2); let catName = currentCategory === "custom" ? "Custom" : `${currentCategory}s`;
            navigator.clipboard.writeText(`🎮 CPS Tester: ${finalCPS} CPS (${clicks} clicks in ${catName})!`); alert("Copied to clipboard!");
        }

        // --- MINIGAME HUB LOGIC ---
        function openMinigameHub() {
            document.getElementById('mg-menu-screen').style.display = "block";
            document.getElementById('mg-versus-screen').style.display = "none";
            showModal('minigame-modal');
        }
        function closeMinigames() { backToHub(); hideModals(); }
        function backToHub() {
            document.getElementById('mg-versus-screen').style.display = "none";
            document.getElementById('mg-menu-screen').style.display = "block";
        }
        function showGame(gameId) {
            document.getElementById('mg-menu-screen').style.display = "none";
            document.getElementById(`mg-${gameId}-screen`).style.display = "block";
        }

        // --- 2-PLAYER VERSUS MODE LOGIC ---
        let vsMode = 'classic'; // 'classic' or 'tug'
        let vsActive = false;
        let vsCountdown = 3;
        let vsTime = 10;
        let p1Score = 0; let p2Score = 0;
        let tugScore = 50; // 50% middle
        let vsInterval;

        function startVersus(mode) {
            vsMode = mode; hideModals();
            document.getElementById('vs-container').style.display = "flex";
            document.getElementById('vs-timer').innerText = "READY";
            
            p1Score = 0; p2Score = 0; tugScore = 50;
            document.getElementById('vs-score-p1').innerText = "0"; document.getElementById('vs-score-p2').innerText = "0";
            
            if (mode === 'tug') {
                document.getElementById('vs-tug-layer').style.display = "flex";
                document.getElementById('tug-red-fill').style.height = "50%";
                document.getElementById('vs-score-p1').style.display = "none";
                document.getElementById('vs-score-p2').style.display = "none";
            } else {
                document.getElementById('vs-tug-layer').style.display = "none";
                document.getElementById('vs-score-p1').style.display = "block";
                document.getElementById('vs-score-p2').style.display = "block";
            }
            
            vsCountdown = 3; vsActive = false;
            let preTimer = setInterval(() => {
                document.getElementById('vs-timer').innerText = vsCountdown;
                vsCountdown--;
                if(vsCountdown < 0) {
                    clearInterval(preTimer);
                    document.getElementById('vs-timer').innerText = mode === 'classic' ? "10.0" : "TUG!";
                    vsActive = true;
                    if(mode === 'classic') startClassicTimer();
                }
            }, 1000);
        }

        function startClassicTimer() {
            vsTime = 10.0;
            vsInterval = setInterval(() => {
                vsTime -= 0.1;
                document.getElementById('vs-timer').innerText = vsTime.toFixed(1);
                if (vsTime <= 0) {
                    clearInterval(vsInterval); vsActive = false;
                    let winner = p1Score > p2Score ? "P1 WINS!" : p2Score > p1Score ? "P2 WINS!" : "TIE!";
                    document.getElementById('vs-timer').innerText = winner;
                }
            }, 100);
        }

        function vsClick(player, e) {
            if (e.type === 'touchstart') e.preventDefault();
            if (!vsActive) return;
            if (navigator.vibrate) navigator.vibrate(15);
            
            if (vsMode === 'classic') {
                if (player === 1) { p1Score++; document.getElementById('vs-score-p1').innerText = p1Score; }
                else { p2Score++; document.getElementById('vs-score-p2').innerText = p2Score; }
            } else if (vsMode === 'tug') {
                // Tug of War: P1 (Top/Red) pushes down (increases red height), P2 pushes up
                if (player === 1) tugScore += 2;
                else tugScore -= 2;
                
                document.getElementById('tug-red-fill').style.height = `${tugScore}%`;
                
                if (tugScore >= 100) {
                    vsActive = false; document.getElementById('vs-timer').innerText = "P1 WINS!";
                } else if (tugScore <= 0) {
                    vsActive = false; document.getElementById('vs-timer').innerText = "P2 WINS!";
                }
            }
        }

        function exitVersus() {
            clearInterval(vsInterval); vsActive = false;
            document.getElementById('vs-container').style.display = "none";
            showModal('minigame-modal'); backToHub();
        }
        
        // Modal Utils
        function showModal(id) { document.getElementById(id).style.display = "flex"; }
        function hideModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = "none"); }
    </script>
</body>
</html>
